schemaVersion: 1

name: agent-tools
version: 0.1.1

# Model routing — cost-effective OpenRouter models (single source of truth).
# Agents' model_preference lists slugs from these tiers; adapters wire the host
# to OpenRouter. free_policy "balanced": simple roles (researcher, technical-writer)
# try a free model first; heavier roles use cheap paid models first.
# Slugs/prices verified on openrouter.ai (Aug 2026) — re-check periodically; free
# tiers are rate-limited and may train on submitted data.
models:
  provider: openrouter
  default: "deepseek/deepseek-v4-flash"
  free_policy: balanced
  tiers:
    cheap: "deepseek/deepseek-v4-flash"          # ~$0.09/$0.18 per M — default workhorse
    long_context: "minimax/minimax-m3"            # ~$0.24/$0.96 — 1M ctx, agentic/tool use
    strong: "z-ai/glm-5.2"                        # ~$0.63/$1.98 — hard reasoning / long-horizon coding
    multilingual: "qwen/qwen3.5-plus-20260420"    # strong multilingual all-rounder
    free: "nvidia/nemotron-3-ultra-550b-a55b:free"  # $0 — rate-limited

